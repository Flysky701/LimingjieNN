[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "labyrinth-nn"
version = "0.1.0"
description = "Clean-room Two-Tower Battle Critic and Global Official-Score Planner for PCR Labyrinth (CN)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
train = [
  "torch>=2.2",
  "numpy>=1.26",
  "pyarrow>=15.0",
  "onnx>=1.16",
  "onnxruntime>=1.18",
]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]
